name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: graphite
          POSTGRES_PASSWORD: graphite
          POSTGRES_DB: graphite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graphite -d graphite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://graphite:graphite@localhost:5432/graphite_test

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  fishing-determinism:
    name: fishing determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2.9.2

      - name: Test deterministic Fishing contracts
        run: |
          cargo test -p graphite-core rng::tests::
          cargo test -p graphite-services --lib fishing_rng::tests::
          cargo test -p graphite-services --test fishing_numeric_policy
          cargo test -p graphite-services --test fishing_weight_bridge_policy
          cargo test -p graphite-services --test fishing_balance_regression
